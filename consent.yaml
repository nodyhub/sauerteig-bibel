items:
  - title: Umami Analytics (functional)
    description: This code gives us insight into the number of people that visit our website, where they are from and what they are clicking on. Umami is a privacy-friendly analytics tool that does not use cookies or collect personal data.
    is_functional: true
    script_file: umami.js
  - title: Crisp chat
    description: This code gives users the option to chat directly with us through a chat box in the bottom right corner. Visitor data will (also) be sent to Crisp.
    is_functional: false
    script_file: crisp.js